<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QEN.US - Digital Soul & Universal Basic Income</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .soul-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glow { box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
        .hidden { display: none; }
    </style>
</head>
<body class="soul-gradient text-white min-h-screen font-sans">

    <nav class="p-6 border-b border-slate-700 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter text-sky-400">QEN.US</div>
        <div id="user-info" class="hidden flex items-center gap-4">
            <span id="user-name" class="font-medium text-slate-300"></span>
            <button onclick="logout()" class="text-xs text-slate-500 underline">로그아웃</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-20 px-6 text-center">
        <div id="login-section">
            <h1 class="text-5xl md:text-7xl font-extrabold mb-8 leading-tight">
                전 인류 80억 명에게 <br><span class="text-sky-400">각 100 QEN 지급</span>
            </h1>
            <button onclick="login()" class="bg-sky-500 hover:bg-sky-400 px-8 py-4 rounded-full text-xl font-bold transition glow">
                Google 로그인하고 100 QEN 받기
            </button>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="bg-slate-800/50 p-10 rounded-3xl border border-sky-500/30 glow mb-12">
                <h2 class="text-2xl mb-4 text-slate-300">나의 지갑 잔액</h2>
                <div class="text-6xl font-black text-sky-400 mb-4">100 <span class="text-2xl text-white">QEN</span></div>
                <p class="text-emerald-400 font-bold">✓ 자아지문 블록체인 등록 완료</p>
            </div>
            <div class="bg-slate-900 rounded-lg p-6 text-left border border-slate-800 font-mono text-sm">
                <code class="text-emerald-400" id="soul-code"></code>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            storageBucket: "qent-39136.firebasestorage.app",
            messagingSenderId: "801696950596",
            appId: "1:801696950596:web:e393c257c13ad1f1448f11",
            measurementId: "G-Y6S2HEBHPN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            const loginSec = document.getElementById('login-section');
            const dashSec = document.getElementById('dashboard-section');
            const userInfo = document.getElementById('user-info');
            if (user) {
                loginSec.classList.add('hidden');
                dashSec.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName + "님";
                document.getElementById('soul-code').innerHTML = `const SOUL_ID = "${user.uid.substring(0,16)}";<br>status: "IMMORTAL_LINKED";`;
            } else {
                loginSec.classList.remove('hidden');
                dashSec.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);
    </script>
</body>
</html>
