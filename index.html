<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QEN.US - Digital Soul Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .soul-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glow { box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        .hidden { display: none; }
    </style>
</head>
<body class="soul-gradient text-white min-h-screen font-sans">

    <nav class="p-6 border-b border-slate-700 flex justify-between items-center">
        <div class="text-2xl font-black tracking-tighter text-sky-400 cursor-pointer" onclick="location.reload()">QEN.US</div>
        <div id="user-info" class="hidden flex items-center gap-4">
            <span id="user-name" class="font-medium text-slate-300 text-sm"></span>
            <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs transition">로그아웃</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-10 px-6 text-center">
        <div id="login-section">
            <h1 class="text-5xl md:text-7xl font-extrabold mb-8 leading-tight">
                80억 인류의 자아지문<br><span class="text-sky-400">100 QEN 지급</span>
            </h1>
            <p class="text-xl text-slate-400 mb-10">로그인 한 번으로 당신의 코인과 자아지문을 영구히 보존하세요.</p>
            <button onclick="login()" class="bg-sky-500 hover:bg-sky-400 px-10 py-5 rounded-full text-xl font-bold transition glow">
                Google 계정으로 간편 로그인
            </button>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="bg-slate-800/50 p-10 rounded-3xl border border-sky-500/30 glow mb-8">
                <h2 class="text-2xl mb-4 text-slate-300">내 지갑 잔액</h2>
                <div class="text-7xl font-black text-sky-400 mb-2">100 <span class="text-3xl text-white font-light">QEN</span></div>
                <p class="text-emerald-400 font-bold mb-6">✓ 블록체인 예약 완료</p>
                
                <div class="flex justify-center gap-4 border-t border-slate-700 pt-6">
                    <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank" class="text-xs bg-white/5 px-4 py-2 rounded-lg hover:bg-white/10 transition">Android 지갑 설치</a>
                    <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank" class="text-xs bg-white/5 px-4 py-2 rounded-lg hover:bg-white/10 transition">iPhone 지갑 설치</a>
                </div>
            </div>

            <div class="bg-slate-900 rounded-xl p-6 text-left border border-slate-800 font-mono text-xs overflow-hidden">
                <div class="text-slate-500 mb-2">// Immutable Soul Identity Info</div>
                <code class="text-emerald-500" id="soul-code"></code>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase 설정 (이미 활성화된 QENT 프로젝트 값)
        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            storageBucket: "qent-39136.firebasestorage.app",
            messagingSenderId: "801696950596",
            appId: "1:801696950596:web:e393c257c13ad1f1448f11"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // [핵심] 로그인 상태 유지 설정 (브라우저를 닫아도 유지됨)
        setPersistence(auth, browserLocalPersistence);

        onAuthStateChanged(auth, (user) => {
            const loginSec = document.getElementById('login-section');
            const dashSec = document.getElementById('dashboard-section');
            const userInfo = document.getElementById('user-info');
            
            if (user) {
                loginSec.classList.add('hidden');
                dashSec.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName + "님";
                document.getElementById('soul-code').innerHTML = `const UID = "${user.uid}";<br>status: "ALIVE_ON_BLOCKCHAIN";<br>balance: 100 QEN;`;
            } else {
                loginSec.classList.remove('hidden');
                dashSec.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        window.login = () => signInWithPopup(auth, provider).catch(err => console.error(err));
        window.logout = () => signOut(auth);
    </script>
</body>
</html>
