<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QEN.US - Digital Soul Expansion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xrpl@2.2.3/dist/xrpl-latest-min.js"></script>
    <style>
        .soul-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="soul-gradient text-white min-h-screen p-8 text-center font-sans">
    <nav class="text-3xl font-black text-sky-400 mb-12 italic tracking-tighter">QEN.US</nav>

    <div id="login-section" class="max-w-md mx-auto">
        <h1 id="title-text" class="text-4xl font-extrabold mb-6 leading-tight">Distributing 100 QEN<br><span class="text-sky-400">to 8 Billion People</span></h1>
        <p id="desc-text" class="text-slate-400 mb-10">Engrave your soulprint on the blockchain forever.</p>
        
        <div class="mb-4">
            <select id="lang-select" onchange="changeLanguage()" class="bg-slate-800 text-white p-3 rounded-xl border border-slate-600 w-full text-center">
                <option value="en">English (Default)</option>
                <option value="ko">한국어</option>
                <option value="zh">中文 (简体)</option>
                <option value="es">Español</option>
                <option value="ja">日本語</option>
            </select>
        </div>

        <button onclick="login()" id="login-btn" class="bg-sky-500 hover:bg-sky-400 px-12 py-5 rounded-full text-2xl font-bold mb-12 shadow-2xl w-full transition-all active:scale-95">Google Member Login</button>
        
        <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700 text-sm">
            <p id="wallet-text" class="text-sky-400 font-bold mb-4 italic">Xaman Wallet (XRPL) Required</p>
            <div class="flex justify-center gap-10 underline font-bold">
                <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank">iPhone</a>
                <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank">Android</a>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-lg mx-auto">
        <div class="bg-slate-800/80 p-10 rounded-3xl border-2 border-sky-500 shadow-2xl w-full">
            <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                <span id="dash-title" class="text-sky-300 font-bold tracking-widest uppercase">Member Account</span>
                <span id="user-display" class="text-xs text-white bg-sky-600 px-2 py-1 rounded"></span>
            </div>
            
            <div class="mb-10 text-center">
                <div id="balance-title" class="text-sm text-slate-400 mb-1 uppercase">Current Balance</div>
                <div class="text-7xl font-black text-white mb-2">100 QEN</div>
                <p id="success-text" class="text-emerald-400 font-bold italic text-sm">✓ Soulprint Engraving Successful</p>
            </div>

            <div class="space-y-4 mb-8 text-left">
                <label id="address-label" class="text-xs text-slate-400 ml-1">Recipient Wallet Address (XRPL)</label>
                <input id="dest-address" type="text" placeholder="Enter r... address" class="w-full p-4 rounded-xl bg-black/40 border border-slate-600 text-sm focus:border-sky-500 outline-none text-white">
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="handleTransaction('receive')" id="receive-btn" class="bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold transition">Receive</button>
                    <button onclick="handleTransaction('send')" id="send-btn" class="bg-sky-600 hover:bg-sky-500 py-4 rounded-xl font-bold transition">Send</button>
                </div>
            </div>
            
            <div class="flex flex-col gap-4 mt-6">
                <button onclick="logout()" id="logout-btn" class="text-xs text-slate-500 underline">Logout</button>
                <code id="soul-id" class="text-[10px] text-slate-600 break-all bg-black/30 p-4 rounded-xl block"></code>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-" + "YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            appId: "1:801696950596:web:" + "e393c257c13ad1f1448f11"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            const loginSec = document.getElementById('login-section');
            const dashSec = document.getElementById('dashboard-section');
            if (user) {
                loginSec.classList.add('hidden');
                dashSec.classList.remove('hidden');
                document.getElementById('user-display').innerText = user.displayName;
                document.getElementById('soul-id').innerText = "MEMBER_UID: " + user.uid;
            } else {
                loginSec.classList.remove('hidden');
                dashSec.classList.add('hidden');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);
        window.handleTransaction = (type) => {
            const dest = document.getElementById('dest-address').value;
            if (type === 'send' && !dest) return alert("Enter recipient address.");
            alert(type === 'send' ? `Initiating 100 QEN transfer to ${dest}` : "Approve 100 QEN reception in Xaman.");
            window.location.href = "xumm://"; 
        };

        // 다국어 데이터
        const translations = {
            en: { title: "Distributing 100 QEN<br><span class='text-sky-400'>to 8 Billion People</span>", desc: "Engrave your soulprint on the blockchain forever.", login: "Google Member Login", wallet: "Xaman Wallet (XRPL) Required", dash: "MEMBER ACCOUNT", balance: "CURRENT BALANCE", success: "✓ Soulprint Engraving Successful", address: "Recipient Wallet Address (XRPL)", receive: "Receive", send: "Send", logout: "Logout" },
            ko: { title: "80억 인류에게<br><span class='text-sky-400'>100 QEN 지급</span>", desc: "당신의 자아지문을 블록체인에 영원히 각인하십시오.", login: "Google 멤버 로그인", wallet: "Xaman 지갑(XRPL) 연동 필수", dash: "MEMBER ACCOUNT", balance: "CURRENT BALANCE", success: "✓ 자아지문(Digital Soul) 각인 성공", address: "상대방 지갑 주소 (XRPL)", receive: "코인 받기", send: "코인 보내기", logout: "로그아웃" },
            zh: { title: "向80亿人类<br><span class='text-sky-400'>发放100 QEN</span>", desc: "将您的自我指纹永久烙印在区块链上。", login: "Google 成员登录", wallet: "必须连接Xaman钱包(XRPL)", dash: "成员账户", balance: "当前余额", success: "✓ 自我指纹烙印成功", address: "对方钱包地址 (XRPL)", receive: "领取币", send: "发送币", logout: "登出" }
        };

        window.changeLanguage = () => {
            const lang = document.getElementById('lang-select').value;
            const t = translations[lang] || translations['en'];
            document.getElementById('title-text').innerHTML = t.title;
            document.getElementById('desc-text').innerText = t.desc;
            document.getElementById('login-btn').innerText = t.login;
            document.getElementById('wallet-text').innerText = t.wallet;
            document.getElementById('dash-title').innerText = t.dash;
            document.getElementById('balance-title').innerText = t.balance;
            document.getElementById('success-text').innerText = t.success;
            document.getElementById('address-label').innerText = t.address;
            document.getElementById('receive-btn').innerText = t.receive;
            document.getElementById('send-btn').innerText = t.send;
            document.getElementById('logout-btn').innerText = t.logout;
        };
    </script>
</body>
</html>
