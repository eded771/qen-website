
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QEN.US - Universal 100 QEN Distribution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .soul-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glow { box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); }
        .hidden { display: none; }
    </style>
</head>
<body class="soul-gradient text-white min-h-screen font-sans">

    <nav class="p-6 border-b border-slate-700 flex justify-between items-center">
        <div class="text-2xl font-black tracking-tighter text-sky-400">QEN.US</div>
        <div id="user-info" class="hidden flex items-center gap-4">
            <span id="user-name" class="font-medium text-slate-300 text-sm"></span>
            <button onclick="logout()" class="text-xs bg-slate-800 px-3 py-1 rounded border border-slate-600 hover:bg-slate-700 transition">로그아웃</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-16 px-6 text-center">
        <div id="login-section">
            <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight">
                80억 인류에게 <br><span class="text-sky-400">100 QEN 지급</span>
            </h1>
            <p class="text-xl text-slate-400 mb-10">Google 계정으로 로그인하고 본인의 지갑으로 코인을 받으세요.</p>
            
            <button onclick="login()" class="bg-sky-500 hover:bg-sky-400 px-12 py-5 rounded-full text-2xl font-bold transition glow mb-12">
                Google 계정 선택하기
            </button>

            <div class="mt-8 p-6 bg-slate-800/30 rounded-2xl border border-slate-700">
                <p class="text-sm text-slate-400 mb-4">QEN 코인을 보관할 XRPL 공식 지갑을 먼저 준비하세요</p>
                <div class="flex justify-center gap-6">
                    <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank" class="hover:scale-105 transition"><img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/ko-kr?size=250x83" alt="iOS" class="h-10"></a>
                    <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank" class="hover:scale-105 transition"><img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Android" class="h-14 -mt-2"></a>
                </div>
            </div>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="bg-slate-800/60 p-10 rounded-3xl border border-sky-500/40 glow mb-8">
                <h2 class="text-2xl mb-2 text-slate-400">내 지갑 잔액</h2>
                <div class="text-8xl font-black text-sky-400 mb-4">100 <span class="text-3xl text-white font-light">QEN</span></div>
                <p class="text-emerald-400 font-bold italic mb-6">✓ 블록체인 예약 완료</p>
                
                <div class="border-t border-slate-700 pt-6">
                    <p class="text-sm text-sky-300 mb-4 font-bold">전송을 위해 Xaman 지갑에 이 계정을 연결하세요</p>
                    <div class="flex justify-center gap-4">
                        <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank" class="text-xs bg-slate-700 px-4 py-2 rounded-lg border border-slate-600">iPhone 설치</a>
                        <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank" class="text-xs bg-slate-700 px-4 py-2 rounded-lg border border-slate-600">Android 설치</a>
                    </div>
                </div>
            </div>
            <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-700 text-left">
                <h3 class="text-sky-400 font-bold mb-2 text-sm text-center">내 고유 자아 코드</h3>
                <code id="soul-id" class="text-xs text-emerald-500 break-all font-mono block text-center"></code>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            storageBucket: "qent-39136.firebasestorage.app",
            messagingSenderId: "801696950596",
            appId: "1:801696950596:web:e393c257c13ad1f1448f11"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        setPersistence(auth, browserSessionPersistence);

        onAuthStateChanged(auth, (user) => {
            const loginSec = document.getElementById('login-section');
            const dashSec = document.getElementById('dashboard-section');
            const userInfo = document.getElementById('user-info');
            if (user) {
                loginSec.classList.add('hidden');
                dashSec.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('soul-id').innerText = user.uid;
            } else {
                loginSec.classList.remove('hidden');
                dashSec.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => window.location.reload());
    </script>
</body>
</html>
