<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QEN.US - Digital Soul & XRPL Mainnet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xrpl@2.14.0/build/xrpl-latest-min.js"></script>
    <style>
        .soul-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glow { box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
        .hidden { display: none; }
    </style>
</head>
<body class="soul-gradient text-white min-h-screen font-sans">

    <nav class="p-6 border-b border-slate-700 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter text-sky-400">QEN.US</div>
        <div id="user-info" class="hidden flex items-center gap-4">
            <span id="user-name" class="font-medium text-slate-300"></span>
            <button onclick="logout()" class="text-xs text-slate-500 underline">로그아웃</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-10 px-6 text-center">
        <div id="login-section">
            <h1 class="text-5xl font-extrabold mb-8">80억 인구에게 <br><span class="text-sky-400">100 QEN 지급</span></h1>
            <p class="text-slate-400 mb-8">당신의 자아지문을 블록체인에 영구히 각인시키세요.</p>
            <button onclick="login()" class="bg-sky-500 hover:bg-sky-400 px-8 py-4 rounded-full text-xl font-bold transition glow">
                Google 로그인하고 지갑 연결
            </button>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="bg-slate-800/50 p-8 rounded-3xl border border-sky-500/30 glow mb-6">
                <h2 class="text-xl mb-2 text-slate-400">XRPL 메인넷 잔액</h2>
                <div class="text-6xl font-black text-sky-400 mb-4"><span id="balance">100</span> <span class="text-2xl text-white">QEN</span></div>
                <div class="text-sm text-slate-500 break-all mb-4" id="wallet-address">Wallet: Loading...</div>
                
                <div class="border-t border-slate-700 pt-4 mt-4">
                    <p class="text-sm text-slate-300 mb-3">코인을 전송하거나 보관하려면 XRPL 공식 지갑이 필요합니다.</p>
                    <div class="flex flex-wrap justify-center gap-3">
                        <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-xs transition">iPhone 지갑 설치</a>
                        <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-xs transition">Android 지갑 설치</a>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800/30 p-6 rounded-2xl border border-slate-700 text-left mb-6">
                <h3 class="font-bold mb-4 text-sky-400">QEN 전송하기</h3>
                <input type="text" id="dest-address" placeholder="받는 사람 XRPL 주소 (r...)" class="w-full p-3 rounded bg-slate-900 border border-slate-700 mb-3 text-sm">
                <input type="number" id="send-amount" placeholder="보낼 수량" class="w-full p-3 rounded bg-slate-900 border border-slate-700 mb-4 text-sm">
                <button onclick="sendToken()" class="w-full bg-emerald-600 py-3 rounded-lg font-bold hover:bg-emerald-500 transition">전송 실행</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            storageBucket: "qent-39136.firebasestorage.app",
            messagingSenderId: "801696950596",
            appId: "1:801696950596:web:e393c257c13ad1f1448f11",
            measurementId: "G-Y6S2HEBHPN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('wallet-address').innerText = "Personal Wallet ID: " + user.uid.substring(0, 15) + "...";
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('user-info').classList.add('hidden');
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        window.sendToken = () => {
            const addr = document.getElementById('dest-address').value;
            if(!addr) return alert("받는 사람 주소를 입력하세요.");
            alert("전송 기능은 Xaman 지갑 설치 후 연동 시 활성화됩니다.");
        };
    </script>
</body>
</html>
