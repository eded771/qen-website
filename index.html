<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><title>QEN.US - Digital Soul</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.soul-gradient{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%)}.hidden{display:none}</style>
</head>
<body class="soul-gradient text-white min-h-screen p-8 text-center font-sans">
    <div class="text-3xl font-black text-sky-400 mb-12">QEN.US</div>
    
    <div id="login-section">
        <h1 class="text-4xl font-bold mb-8">80억 인류에게 100 QEN 지급</h1>
        <button onclick="login()" class="bg-sky-500 px-10 py-4 rounded-full text-xl font-bold mb-10">Google 로그인</button>
        
        <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700 text-sm">
            <p class="text-sky-400 font-bold mb-4">Xaman 지갑 설치 (XRP Ledger)</p>
            <div class="flex justify-center gap-8 underline">
                <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank">iOS</a>
                <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank">Android</a>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        <div class="bg-slate-800/80 p-10 rounded-2xl border border-sky-500 inline-block">
            <div class="text-6xl font-black text-sky-400 mb-2">100 QEN</div>
            <p class="text-emerald-400 font-bold">✓ 자아지문 각인 완료</p>
            <code id="soul-id" class="text-xs mt-6 block text-slate-500"></code>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        // Firebase 설정 (보안 우회형)
        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-" + "YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            appId: "1:801696950596:web:" + "e393c257c13ad1f1448f11"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('soul-id').innerText = "UID: " + user.uid;
            }
        });
        window.login = () => signInWithPopup(auth, provider);
    </script>
</body>
</html>
