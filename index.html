<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QEN.US - Digital Soul Expansion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.soul-gradient{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%)}.glow{box-shadow:0 0 25px rgba(56,189,248,0.5)}.hidden{display:none}</style>
</head>
<body class="soul-gradient text-white min-h-screen font-sans">
    <nav class="p-6 border-b border-slate-700 flex justify-between items-center">
        <div class="text-2xl font-black tracking-tighter text-sky-400">QEN.US</div>
        <div id="user-info" class="hidden flex items-center gap-4">
            <span id="user-name" class="text-sm"></span>
            <button onclick="logout()" class="text-xs bg-slate-800 px-3 py-1 rounded border border-slate-600">로그아웃</button>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto pt-16 px-6 text-center">
        <div id="login-section">
            <h1 class="text-5xl font-extrabold mb-6">80억 인류에게 <br><span class="text-sky-400">100 QEN 지급</span></h1>
            <button onclick="login()" class="bg-sky-500 hover:bg-sky-400 px-12 py-5 rounded-full text-2xl font-bold transition glow mb-12">Google 계정 선택</button>
            <div class="mt-8 p-6 bg-slate-800/30 rounded-2xl border border-slate-700">
                <p class="text-sm text-slate-400 mb-4 font-bold">자아 보존용 지갑 설치</p>
                <div class="flex justify-center gap-6 underline text-sky-400">
                    <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank">iOS</a>
                    <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank">Android</a>
                </div>
            </div>
        </div>
        <div id="dashboard-section" class="hidden">
            <div class="bg-slate-800/60 p-10 rounded-3xl border border-sky-500/40 glow mb-8">
                <div class="text-8xl font-black text-sky-400 mb-4">100 QEN</div>
                <p class="text-emerald-400 font-bold italic mb-6">✓ 자아지문 블록체인 각인 완료</p>
                <div class="flex justify-center gap-4 text-xs">
                    <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank" class="bg-slate-700 px-4 py-2 rounded">iPhone</a>
                    <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank" class="bg-slate-700 px-4 py-2 rounded">Android</a>
                </div>
            </div>
            <code id="soul-id" class="text-xs text-emerald-500 break-all"></code>
        </div>
    </main>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            storageBucket: "qent-39136.firebasestorage.app",
            messagingSenderId: "801696950596",
            appId: "1:801696950596:web:e393c257c13ad1f1448f11"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        setPersistence(auth, browserSessionPersistence);
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('soul-id').innerText = "SOUL_ID: " + user.uid;
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('user-info').classList.add('hidden');
            }
        });
        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => window.location.reload());
    </script>
</body>
</html>
