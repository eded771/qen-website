<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><title>QEN.US - Digital Soul Expansion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.soul-gradient{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%)}.hidden{display:none}</style>
</head>
<body class="soul-gradient text-white min-h-screen p-8 text-center font-sans">
    <nav class="text-3xl font-black text-sky-400 mb-12">QEN.US</nav>

    <div id="login-section">
        <h1 class="text-4xl font-bold mb-6">80억 인류에게 100 QEN 지급</h1>
        <p class="text-slate-400 mb-8 font-medium italic">당신의 자아지문을 블록체인에 영원히 각인하십시오.</p>
        <button onclick="login()" class="bg-sky-500 hover:bg-sky-400 px-12 py-5 rounded-full text-2xl font-bold transition mb-12 shadow-lg">Google 계정으로 시작</button>
        
        <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700 max-w-md mx-auto">
            <p class="text-sky-400 font-bold mb-4 text-sm underline italic">Xaman 지갑(XRP Ledger) 필수 설치</p>
            <div class="flex justify-center gap-10 font-bold">
                <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank" class="hover:text-sky-400">iPhone</a>
                <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank" class="hover:text-sky-400">Android</a>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        <div class="bg-slate-800/80 p-10 rounded-3xl border-2 border-sky-500 inline-block shadow-2xl">
            <div class="text-sm text-sky-300 font-bold mb-2 tracking-widest">CURRENT ASSET</div>
            <div class="text-7xl font-black text-white mb-4">100 QEN</div>
            <p class="text-emerald-400 font-bold mb-8">✓ 자아지문(Digital Soul) 각인 완료</p>
            
            <button onclick="openWallet()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-8 py-4 rounded-xl font-black text-lg mb-6 w-full transition-all transform hover:scale-105">
                코인 수령하기 (Xaman 지갑 연결)
            </button>
            
            <code id="soul-id" class="text-xs text-slate-500 break-all bg-black/30 p-4 rounded-xl block mt-4"></code>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-" + "YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            appId: "1:801696950596:web:" + "e393c257c13ad1f1448f11"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('soul-id').innerText = "PARTICLE_UID: " + user.uid;
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.openWallet = () => {
            alert("Xaman 지갑으로 연결합니다. 지갑 주소를 대조해주십시오.");
            window.location.href = "xumm://"; 
        };
    </script>
</body>
</html>
