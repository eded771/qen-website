<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><title>QEN.US - Digital Soul Expansion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.soul-gradient{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%)}.hidden{display:none}</style>
</head>
<body class="soul-gradient text-white min-h-screen p-8 text-center font-sans">
    <nav class="text-3xl font-black text-sky-400 mb-12">QEN.US</nav>

    <div id="login-section">
        <h1 class="text-4xl font-bold mb-6">80억 인류에게 100 QEN 지급</h1>
        <p class="text-slate-400 mb-8 italic">자아지문을 블록체인에 영원히 각인하고 자산을 확보하세요.</p>
        <button onclick="login()" class="bg-sky-500 hover:bg-sky-400 px-12 py-5 rounded-full text-2xl font-bold mb-12 shadow-lg transition-transform active:scale-95">Google 계정으로 시작</button>
        
        <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700 max-w-md mx-auto text-sm">
            <p class="text-sky-400 font-bold mb-4 italic">Xaman 지갑(XRP Ledger) 연동 필수</p>
            <div class="flex justify-center gap-10 font-bold underline">
                <a href="https://apps.apple.com/us/app/xaman-wallet/id1440530471" target="_blank">iPhone</a>
                <a href="https://play.google.com/store/apps/details?id=com.xrpl.xumm" target="_blank">Android</a>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        <div class="bg-slate-800/80 p-10 rounded-3xl border-2 border-sky-500 inline-block shadow-2xl max-w-lg w-full">
            <div class="text-sm text-sky-300 font-bold mb-2 tracking-widest uppercase">My Asset</div>
            <div class="text-7xl font-black text-white mb-4">100 QEN</div>
            <p class="text-emerald-400 font-bold mb-8 italic">✓ 디지털 자아지문 각인 성공</p>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="openWallet('receive')" class="bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold">코인 받기</button>
                <button onclick="openWallet('send')" class="bg-sky-600 hover:bg-sky-500 py-4 rounded-xl font-bold">코인 보내기</button>
            </div>
            
            <code id="soul-id" class="text-[10px] text-slate-500 break-all bg-black/30 p-4 rounded-xl block"></code>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB28Tpr-" + "YlLs8wCCXhdBKPDzhlRILE1Lf4",
            authDomain: "qent-39136.firebaseapp.com",
            projectId: "qent-39136",
            appId: "1:801696950596:web:" + "e393c257c13ad1f1448f11"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('soul-id').innerText = "UID: " + user.uid;
            }
        });

        window.login = () => signInWithPopup(auth, provider);
        window.openWallet = (type) => {
            alert(type === 'send' ? "상대방 주소를 입력하세요." : "지갑을 대조하여 코인을 수령합니다.");
            window.location.href = "xumm://"; 
        };
    </script>
</body>
</html>
